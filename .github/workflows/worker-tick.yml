name: Worker tick

# Free external scheduler for the ColdReach production worker, needed
# because Vercel Hobby cron runs only once a day. Every five minutes
# this calls the production cron endpoint, which runs the full tick:
# reply sync first, then due sends, then webhook deliveries. It uses
# the repo secret CRON_SECRET, whose value is the same CRON_SECRET set
# in the Vercel project's Production environment variables. GitHub may
# delay scheduled runs under load; workflow_dispatch is the manual
# trigger used to test the wiring.
#
# Revived 2026-11-12: the endpoint URL now uses the production custom
# domain app.aamirtechs.com (the old coldreach-blue.vercel.app address
# was retired), and this edit re-arms the schedule after it stopped
# firing in late October 2026. cron-job.org was retired as the primary
# trigger the same day because its ticks had silently stopped; the
# daily Vercel Cron in vercel.json remains as a once-a-day backstop.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the ColdReach worker tick
        run: 'curl --fail --silent --show-error -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://app.aamirtechs.com/api/cron/tick'
